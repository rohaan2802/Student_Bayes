[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-bayes"
version = "1.0.0"
description = "Bayesian student-performance study with reproducible evaluation and a visual evidence portfolio"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Mohammad Rohaan"}]
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "scipy>=1.15,<2", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "Pillow>=11,<13"]

[project.optional-dependencies]
bayesian = ["pymc>=5.20,<6", "arviz>=0.21,<1", "seaborn>=0.13,<1", "jupyterlab>=4,<5", "nbclient>=0.10,<1"]
verification = ["playwright>=1.50,<2"]

[project.scripts]
student-bayes = "analyze:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["analyze", "build_portfolio", "portfolio_content"]
